<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兒童相關｜Bee Kids</title>
<link rel="stylesheet" href="../assets/site.css">
<script defer src="../assets/site.js"></script>
</head>
<body>
<main id="main" class="page">
<article class="prose">

  <h1>兒童相關</h1>
        <div class="section-header">
        <h2>學生列表</h2>
        <span class="update-time">更新時間：2026/4/14</span>
        </div>
        
        <!-- 年級下拉選單 -->
        <div class="grade-select-group" style="margin-bottom: 1.2rem;">
        <label for="gradeSelect" style="font-weight: bold; margin-right: 0.5rem;">選擇年級：</label>
        <select id="gradeSelect" class="grade-dropdown" style="padding: 0.5rem 1rem; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer;">
        <option value="">-- 請選擇年級 --</option>
        <option value="幼幼">幼幼</option>
        <option value="幼小">幼小</option>
        <option value="幼中">幼中</option>
        <option value="幼大">幼大</option>
        <option value="一年級">一年級</option>
        <option value="二年級">二年級</option>
        <option value="三年級">三年級</option>
        <option value="四年級">四年級</option>
        <option value="五年級">五年級</option>
        <option value="六年級">六年級</option>
        <option value="低出席">低出席</option>
        </select>
        </div>
        
        <!-- 動態顯示學生名單容器 -->
        <div class="student-list-box" id="studentBox">
        <h3 id="currentGradeTitle" style="margin-top: 0;">請選擇年級</h3>
        <p id="studentStatus" style="color: #666;">請從上方下拉選單選擇年級查看名單。</p>
        <ul class="student-tags" id="studentList"></ul>
        </div>

  <div data-children></div>

</article>
</main>
<script src="students.js"></script>
</body>
</html>
