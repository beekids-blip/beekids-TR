<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>兒童相關｜Bee Kids</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; padding: 20px; }
    .section { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .status { color: #666; font-size: 0.9em; }
    .links a { display: inline-block; margin-right: 15px; text-decoration: none; color: #0066cc; }
  </style>
</head>
<body>

  <h1>Bee Kids 兒童紀錄選單</h1>

  <!-- 1. 學生列表快捷 -->
  <div class="section">
    <h2>學生列表</h2>
    <label for="gradeSelect">選擇年級：</label>
    <select id="gradeSelect">
      <option value="">-- 請選擇年級 --</option>
      <option value="幼幼">幼幼</option>
      <option value="幼小">幼小</option>
      <option value="幼中">幼中</option>
      <option value="幼大">幼大</option>
      <option value="一年級">一年級</option>
      <option value="二年級">二年級</option>
      <option value="三年級">三年級</option>
      <option value="四年級">四年級</option>
      <option value="五年級">五年級</option>
      <option value="六年級">六年級</option>
    </select>

    <h3 id="currentGradeTitle">請選擇年級</h3>
    <p id="studentStatus" class="status">請從上方下拉選單選擇年級查看名單。</p>
    <div id="studentList"></div>
  </div>

  <!-- 2. 統計資料快捷 -->
  <div class="section">
    <h2>統計資料</h2>
    <ul>
      <li>小學人數：<span id="statElementary">0</span> 人</li>
      <li>幼兒人數：<span id="statKindergarten">0</span> 人</li>
      <li>總計：<span id="statTotal">0</span> 人</li>
    </ul>
  </div>

  <!-- 3. 學生紀錄快捷 -->
  <div class="section links">
    <h2>學生紀錄快捷連結</h2>
    <a href="https://forms.google.com" target="_blank">新生資料表 Google 表單</a>
    <a href="https://docs.google.com/spreadsheets" target="_blank">學生資料 Google 試算表</a>
    <a href="https://docs.google.com/spreadsheets" target="_blank">出席紀錄 Google 試算表</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
